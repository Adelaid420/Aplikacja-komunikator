<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Miku Communicator Avatar</title>
  <desc id="desc">Pastel teal avatar badge inspired by Miku with a friendly bubble</desc>
  <defs>
    <linearGradient id="hair" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1fd0f5" />
      <stop offset="100%" stop-color="#1683ea" />
    </linearGradient>
    <linearGradient id="bubble" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
    <clipPath id="avatar-clip">
      <circle cx="64" cy="64" r="56" />
    </clipPath>
  </defs>
  <g clip-path="url(#avatar-clip)">
    <rect width="128" height="128" fill="#0c1023" />
    <circle cx="64" cy="64" r="56" fill="url(#hair)" />
    <path d="M32 38c8-8 20-12 32-12s24 4 32 12v36c0 17.7-14.3 32-32 32S32 91.7 32 74V38z" fill="#102246" opacity="0.3" />
    <ellipse cx="64" cy="78" rx="28" ry="22" fill="#ffe6f7" />
    <path d="M42 40c6-10 14-14 22-14s16 4 22 14l-11 6c-4-6-8-9-11-9s-7 3-11 9z" fill="#102246" opacity="0.35" />
    <circle cx="48" cy="66" r="6" fill="#102246" opacity="0.8" />
    <circle cx="80" cy="66" r="6" fill="#102246" opacity="0.8" />
    <path d="M52 88c4 3 8 4 12 4s8-1 12-4" fill="none" stroke="#102246" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>
  <g transform="translate(78 80)">
    <path d="M18 0c9.94 0 18 7.16 18 16 0 12-18 24-18 24S0 28 0 16c0-8.84 8.06-16 18-16z" fill="url(#bubble)" />
    <text x="18" y="20" text-anchor="middle" font-family="'Baloo 2', 'Segoe UI', sans-serif" font-size="12" fill="#1a2b4d">miku</text>
  </g>
